name: Backend CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check changed backend files
        run: |
          node --check config/security.js
          node --check middleware/auth.js
          node --check modules/messages/messages.service.js
          node --check modules/websocket/server.js
          node --check modules/auth/auth.service.js
          node --check index.js

      - name: Unit and schema tests
        run: npm test
